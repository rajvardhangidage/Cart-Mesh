services:
  # =========================================================================
  # Infrastructure Backing Services
  # =========================================================================
  mysql:
    image: mysql:8.0
    container_name: cartmesh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
      MYSQL_DATABASE: authdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ecommerce", "-pecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cartmesh-network

  redis:
    image: redis:7-alpine
    container_name: cartmesh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cartmesh-network

  kafka:
    image: apache/kafka:latest
    container_name: cartmesh-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - cartmesh-network

  # =========================================================================
  # Backend Microservices
  # =========================================================================
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: cartmesh-auth-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_NAME: authdb
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      JWT_SECRET: change-this-development-secret-change-this-development-secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cartmesh-network

  product-service:
    build:
      context: ./backend
      dockerfile: product-service/Dockerfile
    container_name: cartmesh-product-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_NAME: productdb
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      JWT_SECRET: change-this-development-secret-change-this-development-secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cartmesh-network

  inventory-service:
    build:
      context: ./backend
      dockerfile: inventory-service/Dockerfile
    container_name: cartmesh-inventory-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql
      DB_NAME: inventorydb
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      JWT_SECRET: change-this-development-secret-change-this-development-secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cartmesh-network

  cart-service:
    build:
      context: ./backend
      dockerfile: cart-service/Dockerfile
    container_name: cartmesh-cart-service
    ports:
      - "8084:8084"
    environment:
      DB_HOST: mysql
      DB_NAME: cartdb
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      JWT_SECRET: change-this-development-secret-change-this-development-secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cartmesh-network

  order-service:
    build:
      context: ./backend
      dockerfile: order-service/Dockerfile
    container_name: cartmesh-order-service
    ports:
      - "8085:8085"
    environment:
      DB_HOST: mysql
      DB_NAME: orderdb
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      JWT_SECRET: change-this-development-secret-change-this-development-secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cartmesh-network

  payment-service:
    build:
      context: ./backend
      dockerfile: payment-service/Dockerfile
    container_name: cartmesh-payment-service
    ports:
      - "8086:8086"
    environment:
      DB_HOST: mysql
      DB_NAME: paymentdb
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      JWT_SECRET: change-this-development-secret-change-this-development-secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cartmesh-network

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: cartmesh-notification-service
    ports:
      - "8087:8087"
    environment:
      DB_HOST: mysql
      DB_NAME: notificationdb
      DB_USER: ecommerce
      DB_PASSWORD: ecommerce
      JWT_SECRET: change-this-development-secret-change-this-development-secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cartmesh-network

  # =========================================================================
  # API Gateway & Unified Swagger Portal
  # =========================================================================
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: cartmesh-api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_URL: http://auth-service:8081
      PRODUCT_URL: http://product-service:8082
      INVENTORY_URL: http://inventory-service:8083
      CART_URL: http://cart-service:8084
      ORDER_URL: http://order-service:8085
      PAYMENT_URL: http://payment-service:8086
      NOTIFICATION_URL: http://notification-service:8087
    depends_on:
      - auth-service
      - product-service
      - inventory-service
      - cart-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - cartmesh-network

  # =========================================================================
  # Frontend Web Storefront
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cartmesh-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - cartmesh-network

volumes:
  mysql_data: {}

networks:
  cartmesh-network:
    driver: bridge
